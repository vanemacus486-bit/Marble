<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marble — HTML-first knowledge tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="marble-tokens.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  body { font-family: "Geist", system-ui, sans-serif; }
  /* Light masthead above the canvas — sets the project up */
  .masthead {
    position: fixed; left: 24px; top: 18px; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    color: oklch(0.30 0.01 80);
    pointer-events: none;
  }
  .masthead-mark {
    width: 22px; height: 22px; border-radius: 5px;
    background: linear-gradient(135deg, #2a2620, #161413);
    position: relative; overflow: hidden;
  }
  .masthead-mark::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 36%, #d8b96c 41%, #d8b96c 44%, transparent 49%,
                                        transparent 60%, #a48542 62%, transparent 68%);
  }
  .masthead-title { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: #1c1a17; }
  .masthead-sep { width: 1px; height: 14px; background: rgba(0,0,0,0.18); }
  .masthead-sub { font-size: 12.5px; color: rgba(0,0,0,0.55); }
  .masthead-tagline {
    margin-left: 4px; font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: rgba(0,0,0,0.42);
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-mark"></div>
  <div class="masthead-title">Marble</div>
  <div class="masthead-sep"></div>
  <div class="masthead-sub">HTML-first knowledge tool · 3 directions</div>
  <div class="masthead-tagline">// notes that are web pages</div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="marble-chrome.jsx"></script>
<script type="text/babel" src="artboard-editor.jsx"></script>
<script type="text/babel" src="artboard-components.jsx"></script>
<script type="text/babel" src="artboard-reactive.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="marble"
        title="Marble"
        subtitle="HTML-first knowledge tool. Three directions on one wall. Click headings, tabs, and highlighted controls inside each board.">

        <DCArtboard id="editor" label="A · The Editor — block-level HTML toggle" width={1440} height={900}>
          <ArtboardEditor />
        </DCArtboard>

        <DCArtboard id="components" label="B · Components are first-class" width={1440} height={900}>
          <ArtboardComponents />
        </DCArtboard>

        <DCArtboard id="reactive" label="C · The Reactive Vault" width={1440} height={900}>
          <ArtboardReactive />
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
